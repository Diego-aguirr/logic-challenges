schema: spec-driven

context: |
  Project: Logica — JS logic practice platform
  Current stack: Vanilla HTML + JS (single-page, browser-based editor with eval)
  Target stack: Next.js web app (App Router, React, TypeScript)
  Language: Spanish (es-AR)
  Purpose: Practice coding exercises for Alkemy interview prep
  Exercises: 5 browser-validated exercises + 20 guide exercises (strings, arrays, objects, logic)
  Architecture: Monolithic HTML with inline CSS/JS — needs full decomposition for Next.js

testing:
  strict_tdd: false
  runner: none
  framework: none
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: none
  quality_tools:
    linter: none
    type_checker: none
    formatter: none
  note: "No test infrastructure exists. No package.json, no test runner, no linter. Browser eval() is the only validation mechanism. Recommend: Vitest + React Testing Library + Playwright for Next.js migration."

rules:
  proposal:
    - Include migration strategy from vanilla HTML to Next.js App Router
    - Preserve all existing exercises and their test cases
    - Consider incremental migration (keep HTML working during transition)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Specify exercise validation logic as testable contracts
  design:
    - Document component decomposition from monolithic HTML
    - Plan exercise data model and validation engine
    - Consider code editor integration (Monaco or CodeMirror)
  tasks:
    - Group by phase: project setup, data model, components, exercises, styling
    - Keep tasks completable in one session
    - Each exercise should be independently testable
  apply:
    - Follow Next.js App Router conventions
    - Use TypeScript for all new code
    - Implement exercise validation as pure functions (testable without DOM)
  verify:
    test_command: "npx vitest run"
    build_command: "npm run build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
