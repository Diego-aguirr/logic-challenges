name: Deploy and Clean Branches

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  clean-branches:
    name: Clean Old Branches
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged branches
        run: |
          git fetch --prune
          git branch -r --merged origin/main | grep -v "main$" | grep -v "develop$" | sed 's/origin\///' | while read branch; do
            echo "Deleting branch: $branch"
            git push origin --delete "$branch" || true
          done

      - name: Update develop branch
        run: |
          git fetch origin
          if git ls-remote --heads origin develop | grep develop; then
            echo "Updating develop from main"
            git checkout develop
            git reset --hard origin/main
            git push origin develop --force
          else
            echo "Creating develop branch from main"
            git checkout main
            git checkout -b develop
            git push origin develop
          fi
